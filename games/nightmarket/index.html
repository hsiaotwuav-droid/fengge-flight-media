<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04101f;color:#e8f6f8;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{position:relative;z-index:6;display:flex;align-items:center;padding:10px 14px;background:#06182a;border-bottom:1px solid rgba(127,243,227,.25)}
.hm{flex:none;width:34px;height:34px;border-radius:10px;background:#1b3a4e;border:1px solid rgba(127,243,227,.35);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;margin-right:8px}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:15px;color:#F2CF7E}
.lvl{font-size:14px;color:#cfe8ee;white-space:nowrap}.lvl b{color:#7FF3E3}
.clk{display:none;margin-left:8px;font-size:14px;font-weight:900;color:#F2CF7E;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#app.flash #stage{animation:fl .5s}
@keyframes fl{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,107,98,0)}40%{box-shadow:inset 0 0 0 7px rgba(255,107,98,.9)}}
#hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud div{padding:5px 10px;border-radius:10px;background:rgba(4,16,31,.8);border:1px solid rgba(127,243,227,.4);font-size:14px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
#hud .y{color:#F2CF7E}#hud .r{color:#ff6b62}#hud .g{color:#7FF3E3}
#tip{position:absolute;left:12px;right:12px;bottom:10px;padding:7px 10px;border-radius:12px;background:rgba(4,16,31,.82);border:1px solid rgba(242,207,126,.55);font-size:14px;font-weight:800;line-height:1.45;color:#ffe9b8;text-align:center;pointer-events:none;display:none}
#ctl{flex:none;height:150px;background:#06182a;border-top:1px solid rgba(127,243,227,.25);display:flex;align-items:center;justify-content:center;gap:18px}
#pad{position:relative;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,#123449 0,#0b2335 70%);border:2px solid rgba(127,243,227,.45);touch-action:none}
#pad:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(127,243,227,.5)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:linear-gradient(180deg,#2EC4B6,#14857b);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.ctlnote{font-size:13px;line-height:1.55;color:rgba(190,235,255,.75);max-width:150px}
.ctlnote b{color:#F2CF7E}
.btn{margin-top:10px;width:100%;border:0;border-radius:16px;padding:15px;font-size:19px;font-weight:900;font-family:inherit;background:linear-gradient(180deg,#e5463d,#b8241c);color:#fff;box-shadow:0 6px 20px rgba(229,70,61,.35)}
.btn.alt{background:linear-gradient(180deg,#2EC4B6,#14857b);box-shadow:0 6px 20px rgba(46,196,182,.3)}
.btn.dk{background:#1b3a4e;box-shadow:none;font-size:16px;padding:12px}
.btn.lk{display:block;text-decoration:none;text-align:center;background:#1b3a4e;box-shadow:none;font-size:16px;padding:12px;border:1px solid rgba(242,207,126,.6);color:#F2CF7E}
#ov{position:fixed;left:0;right:0;bottom:0;top:55px;background:rgba(2,8,16,.82);display:none;align-items:center;justify-content:center;padding:16px 20px;z-index:5}
#ov.on{display:flex}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#0e2a3d,#06182a);border:1px solid rgba(127,243,227,.35);border-radius:22px;padding:20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{font-size:25px;font-weight:900;margin-bottom:4px}
.card .big{font-size:50px;font-weight:900;color:#F2CF7E;line-height:1.1}
.card p{font-size:15px;line-height:1.6;color:#cfe8ee;margin:8px 0}
.card .note{font-size:12px;color:rgba(190,235,255,.55)}
.ok{color:#7FF3E3}.bad{color:#ff6b62}.warn{color:#F2CF7E}
.mode .btn{text-align:left;padding:13px 16px}.mode .btn small{display:block;font-size:13px;font-weight:700;opacity:.85;margin-top:2px}
.vs{margin:10px 0;padding:10px;border-radius:14px;background:rgba(242,207,126,.1);border:1px solid rgba(242,207,126,.5);font-size:15px;line-height:1.55;color:#ffe9b8}
.recap{text-align:left;margin:8px 0;padding:10px 12px;border-radius:12px;background:rgba(255,107,98,.08);border:1px solid rgba(255,107,98,.35);font-size:13.5px;line-height:1.6;color:#ffd2cf}
.nick{width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1px solid rgba(127,243,227,.45);background:#0b2335;color:#fff;font-size:16px;font-family:inherit;text-align:center}
.ask{margin-top:12px;padding:10px;border-radius:14px;background:rgba(46,196,182,.1);border:1px solid rgba(127,243,227,.45);font-size:15px;line-height:1.55}
.law{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(242,207,126,.08);border:1px solid rgba(242,207,126,.45);font-size:13.5px;line-height:1.6;color:#ffe9b8;text-align:left}
.qa .btn{font-size:16px;padding:12px 14px;text-align:left}
</style>

 for(let i=0;i<=16;i++){const x=10+i*370/16,y=GY-148+28*Math.sin(Math.PI*i/16);cx.fillStyle='#e9e2c8';cx.beginPath();cx.arc(x,y+3,2.6,0,7);cx.fill()}

 L.tg.forEach((ti,n)=>{const T={x:SX[ti],y:GY+L.hy[ti]};const cur=n===S.ti,doneT=n<S.ti;

 if(L.wind){const w=S.gw||L.wind,sp=Math.abs(w);cx.save();cx.strokeStyle='rgba(255,255,255,.75)';cx.lineWidth=2;

 if(S.done){const tp=Math.min(30,Math.max(0,Math.round(S.t-L.par)));lvScore=Math.max(10,100-20*S.crashes-5*Math.max(0,S.exits-1)-tp);
  if(S.exits>1)addMist('被風或手抖帶出圈 '+S.exits+' 次');if(tp>0)why='花了 '+S.t.toFixed(1)+' 秒，超過標準 '+L.par+' 秒。'}

 if(S.fail&&lv===2)return emergency(why);
 showResult(why)}
function showResult(why,extra){const L=S.L;total+=lvScore;$('sc').textContent=total;
 const t=S.done&&S.crashes===0&&lvScore>=90?'完美！':S.done?'好險':'沒停住';const cls=t==='完美！'?'ok':S.done?'warn':'bad';const lastLv=lv>=LEVELS.length-1;
 card.innerHTML='<h2 class="'+cls+'">'+t+'</h2><div class="big">+'+lvScore+'</div>'+(S.crashes?'<p class="bad">撞了 '+S.crashes+' 次，每次扣 20 分</p>':'')+(why?'<p class="warn">'+why+'</p>':'')+(extra||'')+'<p><b>'+L.learn+'</b></p><button class="btn alt" id="nx">'+(lastLv?'看總成績':'下一關 ▶')+'</button><button class="btn dk" id="rt">這關重來一次</button>';

 $('nx').onclick=()=>{ov.classList.remove('on');if(lastLv)final();else{lv++;intro()}};

function emergency(why){card.innerHTML='<h2 class="bad">被風吹走了！</h2><p>'+why+'</p><p class="warn"><b>緊急處置：風大到一直被吹走，你該怎麼做？</b></p><div class="qa">'
 +'<button class="btn dk" data-a="0">A｜拉高一點，上面風比較小</button><button class="btn dk" data-a="1">B｜降低高度、逆風慢慢飛回來，必要時就近找安全空地降落</button><button class="btn dk" data-a="2">C｜一直硬撐，等風停</button></div>';
 ov.classList.add('on');card.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const ok=b.dataset.a==='1';if(ok)lvScore=Math.min(100,lvScore+30);else addMist('緊急處置選錯');
  showResult(why,ok?'<p class="ok">✅ 答對！+30 分。高處風通常更大，先降低高度、逆風飛回，回不來就就近安全降落。</p>':'<p class="bad">❌ 正確是 B：高處風通常更大，硬撐會把電耗光。先降低高度、逆風慢慢飛回，必要時就近找安全空地降落。</p>')})}
async function copyOrShare(btn,text,okTxt,useShare){try{if(useShare&&navigator.share){await navigator.share({title:'夜市套圈圈・精準懸停挑戰',text});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);btn.textContent=okTxt}catch(e){prompt('長按複製這段文字：',text)}}
function final(){const g=total>=450?'懸停之王':total>=350?'穩穩停住':total>=220?'再練一下':'先回去看影片';
 const Hm=mode==='h',sec=secs(),mName=Hm?'挑戰模式':'新手模式';let vs='';
 if(CH){const byT=total===CH.s&&Hm&&CH.t>0,win=total>CH.s||(byT&&+sec<CH.t),lose=total<CH.s||(byT&&+sec>CH.t);
  const res=win?'🏆 你贏了！傳回去讓他知道':lose?(total<CH.s?'😤 差 '+(CH.s-total)+' 分，再挑戰一次？':'😤 同分但慢了 '+(+sec-CH.t).toFixed(1)+' 秒，再挑戰一次？'):'🤝 平手！再來一場分高下';
  vs='<div class="vs">'+CH.n+'：<b>'+CH.s+' 分</b>'+(CH.t?'・'+CH.t+' 秒':'')+'<br>你：<b>'+total+' 分</b>'+(Hm?'・'+sec+' 秒':'')+'<br><b style="font-size:18px">'+res+'</b></div>'}
 const lvs=[...new Set(mist.map(m=>m.lv))];
 const recap=mist.length?'<div class="recap"><b>你卡在這裡：</b><br>'+mist.map(m=>'第 '+m.lv+' 關〈'+m.t+'〉'+m.s).join('<br>')+'</div>':'<p class="ok"><b>全部零失誤 👏</b></p>';
 const cmt='#夜市套圈圈 '+mName+' '+total+' 分'+(Hm?'・'+sec+' 秒':'')+(lvs.length?'，我卡在第 '+lvs.join('、')+' 關':'，零失誤！');
 card.innerHTML='<h2>總成績・'+mName+'</h2><div class="big">'+total+'<span style="font-size:24px;color:#9fd8cf"> / 500</span></div>'+(Hm?'<p class="warn" style="font-size:18px;font-weight:900">⏱ '+sec+' 秒</p>':'')+'<p class="warn" style="font-size:22px;font-weight:900">'+g+'</p>'+vs+recap
  +'<p>口訣：<br><b>小量修正、逆風推、放開前先穩住。</b></p>'

 ov.classList.add('on');ov.scrollTop=0;card.scrollTop=0;

window.__T={win(){const T=targetPos(S.L,S.ti);S.x=T.x;S.y=T.y;S.vx=S.vy=0},crash(){crash('撞到〈測試〉攤位')},timeout(){S.t=S.L.limit}};
